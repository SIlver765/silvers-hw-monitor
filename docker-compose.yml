version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_HARDWARE_MONITOR_WEB_IP
      APP_PORT: 3300

  web:
    image: ghcr.io/jbechara34/silvers-hw-monitor:1.0.0
    restart: on-failure
    # Reading temps only needs /sys mounted (Docker already exposes host sysfs read-only
    # by default). Writing fan speed needs read-write access to the hwmon PWM files.
    volumes:
      - /sys/class/hwmon:/sys/class/hwmon:rw
    cap_add:
      - SYS_RAWIO
    environment:
      PORT: "3300"
